name: secureguard
description: SecureGuard Mobile App — Remote file protection management

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.4
  
  # Backend
  supabase_flutter: ^2.8.4
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Auth & Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  
  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  csv: ^6.0.0
  pdf: ^3.11.4
  printing: ^5.13.5
  
  # HTTP
  http: ^1.3.0
  
  # Misc
  audioplayers: ^6.4.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "../../SecureGuard.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
